<body>

<div class="header-wrapper">
  <div>  
    <h1 class="header"> Which Ouran Host Are You?</h1>
  </div>
  <div>
    <p>Answer the questions to discover which Host Club member 
    matches your personality!</p>
  </div> 
</div>

  <!-- Question#1 -->
<div class="choice-wrapper">
  <h2 class="question-1"> Your friend is having a terrible day. What do you do? </h2>
 <div>
  <form>
    <div>

      <div class="choice-button">
        <label>
          <input type="radio" name="question-1">
          Try to cheer them up!
        </label>
      </div>

      <div class="choice-button">
        <label>
          <input type="radio" name="question-1">
          Calmly asked them what's wrong & asked if they need help
        </label>
      </div>

      <div class="choice-button">
        <label>
          <input type="radio" name="question-1">
          Crack jokes to distract them from their problems
        </label>
      </div>

      <div class="choice-button">
        <label>
          <input type="radio" name="question-1">
          Sit & listen to them talk; just sit in silence with them
        </label>
      </div>

    </div>
  </form>
</div>










<div>
  <button class="results-button" id="result-button">
      See My Result
  </button>
</div>


  <script src="js/main.js"></script>
</body>

</html>
